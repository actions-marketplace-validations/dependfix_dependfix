pull_request_rules:
  - name: automatic merge for Dependabot pull requests
    conditions:
      # test.yml 的 Test / Coverage / E2E / Visual Regression 是并列的独立 job，各自生成独立
      # check run：check-success=Test 不覆盖其余三个。门禁必须覆盖**同批全部 PR job**，
      # 否则 Coverage 归零、E2E 失败、视觉基线漂移都会被自动合并进 master。
      # 漂移由 `pnpm run check:mergify` 机检（CI Test job 阻断）；skipped ≠ success，
      # 目标仓若对 job 做路径过滤需自行裁剪条件。
      - check-success=Test
      - check-success=Coverage
      - check-success=E2E
      - check-success=Visual Regression
      - author~=^dependabot(|-preview)\[bot\]$
      - label=dependencies
    actions:
      merge:
        method: rebase

  # dependfix 自身创建的 PR（M19.2 起 dependfix 用 `dependfix[bot]` 身份提交 commit；
  # PAT 路径走 `dependfix[bot]`，GitHub App 路径走动态生成的 `{app_id}+{bot_login}[bot]`
  # —— 见 M18.2 commit author 动态化）。不加 label 条件是因为 dependfix 创建 PR 时
  # 不打固定 label（依赖下游 labels.addLabels 手动加 `duplicate` 等）；author 正则
  # 足够约束范围 + 防止误合并外部贡献者 PR。
  #
  # 与 M24.1 PR Check 监测的边界（docs/plan/todo.md §M24.1 关键决策 D8）：
  # mergify 负责「通过即合」（按同批全部 PR job 触发 rebase merge）；
  # dependfix 平台 PR Check（apps/platform/app/pages/pr-checks.vue）负责「失败即显」
  # （监测 + alert firing + ack UI）。两条链路互不干扰：
  # - mergify 在同批全部 PR job（Test / Coverage / E2E / Visual Regression）通过时触发合并；
  #   任一 job 失败 / 跳过时 mergify 不合并
  # - PRCheck 在 alert firing 时仅显示 UI 告警 + 写 alert_event，不阻止合并
  # 因此 PR Check alert firing 不会影响 mergify 决策；mergify 仍按上述四条 `check-success`
  # 触发（check 归因只作解释、不构成豁免）。详见 docs/design/governance/experience-archive.md
  # §五十六 M24.1 案例。
  - name: automatic merge for dependfix bot pull requests
    conditions:
      # 与 Dependabot 规则同批 job（漂移由 `pnpm run check:mergify` 阻断）
      - check-success=Test
      - check-success=Coverage
      - check-success=E2E
      - check-success=Visual Regression
      - author~=^(.+?\+)?dependfix\[bot\]$
    actions:
      merge:
        method: rebase
