name: Security Auto Fix

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "运行模式"
        type: choice
        required: true
        options:
          - report-only
          - fix
          - fix-and-pr
        default: fix-and-pr
      severity-threshold:
        description: "严重级别阈值"
        type: choice
        required: false
        options:
          - critical
          - high
          - medium
          - all
        default: all
      dry-run:
        description: "试运行模式（不修改文件，仅在 fix 模式下生效）"
        type: boolean
        required: false
        default: false
      max-alerts-per-repository:
        description: "每仓库最多处理的告警数"
        type: string
        required: false
        default: "100"
      repos:
        description: "目标仓库列表（逗号分隔 owner/repo，留空默认使用当前仓库）"
        type: string
        required: false
        default: ""
      cleanup-branches-auto:
        description: "（fix-and-pr 模式）结束后自动删除已合并/已关闭的 dependfix 分支（非交互；不删有 open PR 的分支）"
        type: boolean
        required: false
        default: true
      commands:
        description: "自定义验证命令（逗号分隔；留空使用本仓库自用链：install + nuxt prepare + lint + build + typecheck + test）"
        type: string
        required: false
        default: ""
  schedule:
    # 每天 UTC 0:00（北京时间 8:00）——Dependabot alerts 按天更新，每日巡检覆盖新增漏洞
    - cron: "0 0 * * *"

permissions:
  contents: write
  pull-requests: write
  security-events: read

concurrency:
  group: security-auto-fix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dependfix:
    name: Dependfix Security Scan
    runs-on: ubuntu-latest
    # 超时预算依据（2026-10-15 实测）：本 workflow 历史成功运行耗时 298s / 496s（job 上限原为 900s）；
    # 自用链补入 `pnpm test` 后，有告警仓库要跑两次链（修复前基线采样 + 修复后验证），
    # 增量 ≈ 2 × 容器内全量 vitest（本机实测 51s）→ 故上限提至 1500s 留出余量。
    # 单命令超时仍由引擎侧约束（10 分钟/条，见 packages/engine/src/runners/verification-runner.ts）。
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Dependfix Action
        # schedule 触发时 inputs 为空 → 下方回退值生效（fix-and-pr / high / 20 / cleanup=false），
        # 设计意图：定时巡检保守（聚焦 high+、不自动清理分支）；手动触发可用 inputs 覆盖（可更激进）
        uses: ./
        with:
          mode: ${{ inputs.mode || 'fix-and-pr' }}
          severity-threshold: ${{ inputs.severity-threshold || 'all' }}
          dry-run: ${{ inputs.dry-run || 'false' }}
          max-alerts-per-repository: ${{ inputs.max-alerts-per-repository || '50' }}
          repos: ${{ inputs.repos || '' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Dependabot alerts 读取需最小权限 PAT（fine-grained，仅 Dependabot alerts: read）；
          # GITHUB_TOKEN 无法读取该 API。仓库 Settings → Secrets 配置 GH_PAT。
          dependabot-alerts-token: ${{ secrets.GH_PAT }}
          cleanup-branches-auto: ${{ inputs.cleanup-branches-auto || 'true' }}
          # 自用验证链：与引擎默认链（install + lint + build + typecheck + test）保持语义一致，
          # 仅多一步 `nuxt prepare`（本仓库 eslint 依赖 .nuxt/tsconfig.json 生成物，默认链无该步骤会
          # 导致解析失败——教训见 docs/design/governance/experience-archive-§36-§40-toolchain.md）。
          # `--commands` 是整链替换语义：默认链扩展不会自动跟随自用链，故本文件的链条由
          # `pnpm run check:verify-chain` 做一致性门禁（缺项未声明即 CI 失败）。
          commands: ${{ inputs.commands || 'pnpm install --frozen-lockfile, pnpm --filter @dependfix/platform exec nuxt prepare, pnpm lint, pnpm build, pnpm typecheck, pnpm test' }}
